dataset_root: data/tartan
model: models/weights/lcafnet_m3fd.onnx
backend: tensorrt
engine: models/weights/jetson/lcafnet_m3fd_fp32.engine
thermal_profile: configs/tartan_thermal_profile.json
thermal_refinement: configs/tartan_fixed_refinement.json
score_threshold: 0.25
nms_iou: 0.45
onnx_threads: 4
opencv_threads: 10
max_time_error_s: 0.032
min_depth_points: 20
warmup_frames: 3
video_timeline: compact_valid
residual_alignment: false
temporal_compensation: true
max_position_depth_m: 30.0
registration_backend: cuda
prefetch_frames: 2
cuda_preprocess: true
async_video: true
video_encoder: jetson_h264
video_title_frames: 0
video_bitrate: 1800000
cuda_compact: true
preparation_workers: 2
cuda_graph: true
cuda_decode: true
cuda_mapped_outputs: true
inference_workers: 2
inference_dispatch: independent
render_queue_frames: 1
