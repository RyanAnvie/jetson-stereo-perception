[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multimodal-perception"
version = "0.1.0"
description = "Auditable RGB, thermal and estimated-depth replay"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "opencv-python>=4.8", "PyYAML>=6"]

[project.optional-dependencies]
test = ["pytest>=8"]
download = ["huggingface_hub>=0.27"]
detector = ["onnxruntime>=1.17"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
